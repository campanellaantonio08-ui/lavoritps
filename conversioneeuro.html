<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Convertitore Valute BCE</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    width: 350px;
  }
  h2 {
    font-size: 20px;
    margin-top: 0;
    margin-bottom: 20px;
    color: #2c3e50;
    text-align: center;
  }
  .form-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: 600;
    color: #555;
  }
  select, input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus, input:focus {
    border-color: #3498db;
  }
  button {
    width: 100%;
    padding: 10px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color: 0.2s;
    margin-top: 10px;
  }
  button:hover {
    background-color: #2980b9;
  }
  #risultato {
    margin-top: 20px;
    text-align: center;
    font-size: 16px;
    color: #2c3e50;
  }
</style>
</head>
<body onload="carica()">
    <div class="card">
        <h2>Convertitore BCE</h2>
        
        <div class="form-group">
            <label for="valuta">Seleziona la valuta:</label>
            <select id="valuta"></select>
        </div>

        <div class="form-group">
            <label for="quantita">Quantità:</label>
            <input type="number" id="quantita" value="1" step="any">
        </div>

        <button onclick="converti()">Converti in Euro</button>

        <div id="risultato"></div>
    </div>

<script>
function carica() {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            myFunction(this);
        }
    };
    xhttp.open("GET", "https://proxy.cors.dev/https://ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml", true);
    xhttp.send();
}

function myFunction(xml) {
    var xmlDoc = xml.responseXML;
    var cubes = xmlDoc.getElementsByTagName("Cube");
    var select = document.getElementById("valuta");
    
    var optionEuro = document.createElement("option");
    optionEuro.value = "1";
    optionEuro.text = "EUR - Euro (1)";
    select.appendChild(optionEuro);

    for (var i = 0; i < cubes.length; i++) {
        var currency = cubes[i].getAttribute("currency");
        var rate = cubes[i].getAttribute("rate");
        
        if (currency && rate) {
            var opt = document.createElement("option");
            opt.value = rate;
            opt.text = currency + " (Tasso: " + rate + ")";
            select.appendChild(opt);
        }
    }
}

function converti() {
    var quantita = parseFloat(document.getElementById("quantita").value);
    var select = document.getElementById("valuta");
    var rate = parseFloat(select.value);

    if (quantita <= 0 || !quantita) {
        document.getElementById("risultato").innerHTML = "Quantità non valida!";
        return;
    }
    
    var euro = quantita / rate;
    
    document.getElementById("risultato").innerHTML = 
        quantita + " valuta estera corrispondono a <b>" + euro.toFixed(2) + " €</b>";
}
</script>
</body>
</html>
